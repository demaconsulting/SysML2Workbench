---
sections:
  - title: 'SysML2Workbench Requirements'
    sections:
      - title: 'AppShellSubsystem Requirements'
        requirements:
          - id: 'SysML2Workbench-AppShellSubsystem-PresentSelectedView'
            title: 'The AppShellSubsystem shall host the main desktop window regions needed to present the workspace, selected view, custom-view workflow, and diagnostics together.'
            justification: |
              The desktop shell is responsible for turning the individual Phase 0 capabilities into a cohesive user experience.
            children:
              - 'SysML2Workbench-AppShellSubsystem-MainWindowShell-ArrangePrimaryRegions'
              - 'SysML2Workbench-AppShellSubsystem-MainWindowShell-ManageViewTabs'
            tests:
              - 'Startup_ShowsWorkspaceDiagramAndDiagnosticsRegions'

          - id: 'SysML2Workbench-AppShellSubsystem-CoordinateSessionWorkspace'
            title: 'The AppShellSubsystem shall coordinate active workspace, view-selection, custom-view, and diagnostics state across the main window session.'
            justification: |
              Navigation across tabs and panels requires the shell to keep the current session context synchronized for the user.
            children:
              - 'SysML2Workbench-AppShellSubsystem-MainWindowShell-SynchronizeSessionState'
            tests:
              - 'SessionChanges_SynchronizeShellState'

          - id: 'SysML2Workbench-AppShellSubsystem-HostCustomViewWorkflow'
            title: 'The AppShellSubsystem shall expose commands and surfaces that let users preview and export custom views without leaving the main window.'
            justification: |
              The GUI custom-view feature must be reachable and usable from the same shell session as workspace browsing and diagram viewing.
            children:
              - 'SysML2Workbench-AppShellSubsystem-MainWindowShell-ArrangePrimaryRegions'
              - 'SysML2Workbench-AppShellSubsystem-MainWindowShell-SynchronizeSessionState'
              - 'SysML2Workbench-AppShellSubsystem-MainWindowShell-RenderCustomViewPreviewWithoutMutatingTabs'
              - 'SysML2Workbench-AppShellSubsystem-ViewBuilderDialog-LiveUpdatePreviewOnEveryEdit'
              - 'SysML2Workbench-AppShellSubsystem-ViewBuilderDialog-CommitCreatesNewDiagramTab'
              - 'SysML2Workbench-AppShellSubsystem-ViewBuilderDialog-CancelDiscardsWithoutSideEffects'
            tests:
              - 'CustomViewWorkflow_PreviewsAndExportsFromShell'

          - id: 'SysML2Workbench-AppShellSubsystem-DefaultSidebarPanel'
            title: 'The AppShellSubsystem shall present the workspace panel as the sidebar panel shown by default when the application starts, ahead of the predefined-views panel in the same sidebar.'
            justification: |
              The workspace tree is the first thing a user needs at startup - sources must be added before any view can be
              rendered - so it is the sidebar panel shown by default, matching the order the View menu already lists the
              panels in. This behavior is realized by the subsystem's UI composition layer rather than by a documented
              unit, so it is verified at subsystem level.
            tests:
              - 'Startup_ShowsWorkspacePanelAsDefaultSidebarTab'

          - id: 'SysML2Workbench-AppShellSubsystem-ShowActiveDocumentStatus'
            title: 'The AppShellSubsystem shall display a status area along the bottom of the main window summarizing the currently active document.'
            justification: |
              Users need to tell at a glance which file or view the front tab presents - the tab label alone is truncated and
              omits the file path and the entities a diagram exposes - and need a neutral idle indication when no document
              is open at all.
            children:
              - 'SysML2Workbench-AppShellSubsystem-MainWindowShell-SummarizeActiveTab'
            tests:
              - 'ActiveTabChanges_ProduceStatusSummary'
