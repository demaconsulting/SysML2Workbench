---
# Spell-Checking with TextLint
#
# PURPOSE:
# - Maintain professional documentation and code quality
# - Catch spelling errors before publication
# - Support consistent technical terminology usage
# - Misspelled words should be fixed in the source
# - NEVER add a misspelled word to the 'words' list
# - NEVER add a British-English spelling - correct to US-English in the source
# - PROPOSE only genuine technical terms/names as needed
version: '0.2'
language: en
# The files to spell-check
files:
  - '**/*.{md,yaml,yml,json,cs,cpp,hpp,h,txt}'
# Also check hidden paths such as .github/ and .*.yaml
enableGlobDot: true
# Project-specific technical terms and tool names
words:
  - APFS
  - Argb
  - assertable
  - atspi
  - automatable
  - avaloniaedit
  - avares
  - AXAML
  - axaml
  - BGRA
  - Blockquotes
  - bursty
  - communitytoolkit
  - dcterms
  - Dema
  - DEMA
  - demaconsulting
  - distributables
  - DISTRIBUTABLES
  - dockable
  - Dockable
  - dockables
  - Dockables
  - doctitle
  - docversion
  - Hmmssfff
  - mvvm
  - Mvvm
  - MVVM
  - ncipollo
  - nestings
  - netstandard
  - NOSONAR
  - novawindows
  - ordinally
  - pagetitle
  - pasteable
  - renderable
  - reparsed
  - reparses
  - retarget
  - retargeted
  - retargets
  - Retargets
  - sarif
  - shopt
  - slnx
  - sonarscanner
  - startable
  - thirdparty
  - timeslice
  - TOCTOU
  - unautomatable
  - uncontended
  - unidirectionality
  - unioned
  - unsupplied
  - unwatches
  - Unwatches
  - Unwatching
  - unwatching
  - venv
  - winapi
  - Winlogon
  - wixproj
  - XSHD
  - xshd
  - Xshd
  - yamlfix
ignorePaths:
  - '**/.git/**'
  - '**/node_modules/**'
  - '**/.venv/**'
  - '**/thirdparty/**'
  - '**/third-party/**'
  - '**/3rd-party/**'
  - '**/generated/**'
  - '**/.agent-logs/**'
  - '**/bin/**'
  - '**/obj/**'
  - package-lock.json
